default-members = [
    "apps/freemix-cli",
    "crates/foundation/fm-animation",
    "crates/foundation/fm-capabilities",
    "crates/foundation/fm-command",
    "crates/foundation/fm-grade",
    "crates/foundation/fm-preset-file",
    "crates/foundation/fm-model",
    "crates/foundation/fm-protocol",
    "crates/foundation/fm-script",
    "crates/foundation/fm-types",
    "crates/media/fm-clock",
    "crates/media/fm-frame",
    "crates/media/fm-graph",
    "crates/media/fm-audio",
    "crates/media/fm-playback",
    "crates/media/fm-scheduler",
    "crates/media/fm-sim",
    "crates/media/fm-video",
    "crates/io/fm-codec-image",
    "crates/features/fm-switcher",
    "crates/services/fm-daemon-arguments",
    "crates/services/fm-daemon-journal",
    "crates/services/fm-daemon-native",
    "crates/services/fm-daemon-render",
    "crates/services/fm-daemon-statistics",
    "crates/services/fm-daemon-status",
    "crates/services/fm-overlay-layout",
    "crates/services/fm-daemon-web",
    "crates/services/fm-persistence",
    "crates/services/fm-engine",
    "crates/services/fm-auth",
    "crates/services/fm-control",
    "crates/services/fm-server",
    "crates/services/fm-client",
    "crates/services/fm-title-render",
    "crates/ui/fm-ui-model",
    "tools/xtask",
