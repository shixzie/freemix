resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
debug = "line-tables-only"

# Per-pixel CPU composition is unusably slow unoptimized; debug builds of the
# daemon, CLI renders, and tests spend seconds per 1080p frame otherwise.
[profile.dev.package.fm-video]
opt-level = 2

[profile.dev.package.fm-compositor]
opt-level = 2

# Live sources resample every captured sample through a 72-tap sinc kernel
# (AU-004); unoptimized, a debug daemon spends milliseconds per frame on it.
[profile.dev.package.fm-audio]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
