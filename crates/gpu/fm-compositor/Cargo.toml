[package]
name = "fm-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-wgpu = ["dep:fm-gpu", "dep:half", "fm-gpu/native-wgpu", "fm-color/native-wgpu"]

[dependencies]
fm-animation = { path = "../../foundation/fm-animation" }
fm-color = { path = "../fm-color" }
fm-frame = { path = "../../media/fm-frame" }
fm-grade = { path = "../../foundation/fm-grade" }
fm-gpu = { path = "../fm-gpu", optional = true }
fm-types = { path = "../../foundation/fm-types" }
fm-video = { path = "../../media/fm-video" }
half = { version = "2.7.1", optional = true }

[dev-dependencies]
half = "2.7.1"

[lints]
workspace = true
