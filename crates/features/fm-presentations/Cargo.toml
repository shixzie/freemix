[package]
name = "fm-presentations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fm-types = { path = "../../foundation/fm-types" }
# Pure-Rust PDF rasterizer (MIT OR Apache-2.0): no system PDF library is
# needed on any platform. Its default features embed the standard 14 font
# substitutes and the CJK CMaps, so unembedded fonts still render.
hayro = "0.8"
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
