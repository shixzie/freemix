[package]
name = "fm-io-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fm-codec-ffmpeg = { path = "../fm-codec-ffmpeg" }
fm-types = { path = "../../foundation/fm-types" }

[target.'cfg(target_os = "linux")'.dependencies]
linuxvideo = "0.3.5"
x11rb = { version = "0.13.2", features = ["randr"] }
# Wayland screen and window capture (IN-011): the xdg-desktop-portal
# ScreenCast interface over D-Bus, in pure Rust.
async-io = "2.3.2"
futures-lite = "2.6.0"
zbus = "5.19.0"
# The PipeWire stream a Wayland desktop shares, read through libpipewire
# loaded at run time (nothing PipeWire is needed to build).
fm-io-pipewire = { path = "../fm-io-pipewire" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["randr"] }

[lints]
workspace = true
