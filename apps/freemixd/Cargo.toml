[package]
name = "freemixd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Borderless fullscreen display outputs (OR-011) through winit windows on
# every platform; `macos-program-surface` is the historical name.
display-surface = ["native-media", "dep:winit", "fm-daemon-arguments/display-surface"]
macos-program-surface = ["display-surface"]
native-media = [
    "dep:fm-codec-ffmpeg",
    "dep:fm-color",
    "dep:fm-gpu",
    "dep:fm-daemon-native",
    "dep:fm-io-linux",
    "dep:fm-io-macos",
    "dep:fm-io-network",
    "dep:fm-io-omt",
    "dep:fm-record",
    "dep:fm-replay",
    "dep:fm-scheduler",
    "fm-color/native-wgpu",
    "fm-daemon-render/native-media",
    "fm-daemon-statistics/native-media",
    "fm-compositor/native-wgpu",
    "fm-gpu/native-wgpu",
    "fm-title-render/images",
]

[dependencies]
fm-audio = { path = "../../crates/media/fm-audio" }
fm-auth = { path = "../../crates/services/fm-auth" }
fm-clock = { path = "../../crates/media/fm-clock" }
fm-codec-ffmpeg = { path = "../../crates/io/fm-codec-ffmpeg", optional = true }
fm-codec-image = { path = "../../crates/io/fm-codec-image" }
fm-color = { path = "../../crates/gpu/fm-color", optional = true }
fm-command = { path = "../../crates/foundation/fm-command" }
fm-compositor = { path = "../../crates/gpu/fm-compositor" }
fm-control = { path = "../../crates/services/fm-control" }
fm-daemon-arguments = { path = "../../crates/services/fm-daemon-arguments" }
fm-daemon-journal = { path = "../../crates/services/fm-daemon-journal" }
fm-daemon-native = { path = "../../crates/services/fm-daemon-native", optional = true }
fm-daemon-render = { path = "../../crates/services/fm-daemon-render" }
fm-daemon-statistics = { path = "../../crates/services/fm-daemon-statistics" }
fm-daemon-status = { path = "../../crates/services/fm-daemon-status" }
fm-daemon-web = { path = "../../crates/services/fm-daemon-web" }
fm-engine = { path = "../../crates/services/fm-engine" }
fm-frame = { path = "../../crates/media/fm-frame" }
fm-gpu = { path = "../../crates/gpu/fm-gpu", optional = true }
fm-io-api = { path = "../../crates/io/fm-io-api" }
fm-io-linux = { path = "../../crates/io/fm-io-linux", optional = true }
fm-io-network = { path = "../../crates/io/fm-io-network", optional = true }
fm-io-omt = { path = "../../crates/io/fm-io-omt", optional = true }
fm-observability = { path = "../../crates/services/fm-observability" }
fm-overlay-layout = { path = "../../crates/services/fm-overlay-layout" }
fm-scheduler = { path = "../../crates/media/fm-scheduler", optional = true }
fm-sim = { path = "../../crates/media/fm-sim" }
fm-model = { path = "../../crates/foundation/fm-model" }
fm-persistence = { path = "../../crates/services/fm-persistence" }
fm-plugin-host-api = { path = "../../crates/features/fm-plugin-host-api" }
fm-presentations = { path = "../../crates/features/fm-presentations" }
fm-record = { path = "../../crates/media/fm-record", optional = true }
fm-replay = { path = "../../crates/media/fm-replay", optional = true }
fm-protocol = { path = "../../crates/foundation/fm-protocol" }
fm-server = { path = "../../crates/services/fm-server" }
fm-switcher = { path = "../../crates/features/fm-switcher" }
fm-titles = { path = "../../crates/features/fm-titles" }
fm-title-render = { path = "../../crates/services/fm-title-render" }
fm-types = { path = "../../crates/foundation/fm-types" }
fm-video = { path = "../../crates/media/fm-video" }
fs4 = "0.13"
getrandom = "0.3"
serde_json = "1.0"
# Web gateway TLS (RC-007): rustls on the `ring` provider (no aws-lc-rs, so no
# CMake/NASM toolchain), rcgen for the local root and the leaves it issues
# (its `x509-parser` feature reloads the root to sign with), x509-parser to
# validate certificates before they are served, and ring's SHA-256 for
# certificate fingerprints and device-token digests.
# Web gateway reach (RC-007): a pure-Rust mDNS / DNS-SD responder (no async
# runtime) advertising `_freemix._tcp` and `_https._tcp`, the LAN addresses
# the certificate names, and the host name the default mDNS name derives
# from.
winit = { version = "0.30.13", optional = true, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
fm-io-macos = { path = "../../crates/io/fm-io-macos", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4.7"

[dev-dependencies]
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify"] }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
fm-client = { path = "../../crates/services/fm-client", features = ["std-tcp"] }
fm-grade = { path = "../../crates/foundation/fm-grade" }
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.20"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13.2"

[lints]
workspace = true
