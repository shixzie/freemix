<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeMix LiveLAN</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font: 16px system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100%; gap: 12px; padding: 12px;
    box-sizing: border-box; }
  video { width: 100%; max-height: 85vh; background: #000; }
  [hidden] { display: none !important; }
  form { display: flex; gap: 8px; }
  input { font-size: 20px; width: 9em; padding: 6px; letter-spacing: 0.2em; }
  button { font-size: 18px; padding: 6px 14px; }
  #status { min-height: 1.4em; color: #bbb; text-align: center; }
</style>
</head>
<body>
<main>
  <video id="video" controls autoplay muted playsinline hidden></video>
  <form id="pin-form" hidden>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"
      pattern="[0-9]*" maxlength="12" aria-label="PIN" placeholder="PIN">
    <button type="submit">Watch</button>
  </form>
  <p id="status">Connecting...</p>
</main>
<script>
"use strict";
// The stream is HLS with fragmented-MP4 segments. A browser that plays HLS
// itself is handed the playlist; any other browser with Media Source
// Extensions plays it through MsePlayer below, which fetches the playlist,
// the initialization segment, and the media segments (each with the
// session cookie) and appends them to one SourceBuffer.
const video = document.getElementById("video");
const form = document.getElementById("pin-form");
const pinInput = document.getElementById("pin");
const status = document.getElementById("status");
const playlist = "/live/index.m3u8";
const LIVE_MESSAGE = "Live. Unmute with the video controls.";
// Segments behind the newest one a player starts from.
const START_BEHIND = 2;
// Seconds behind the newest buffered media a playing video is moved up to.
const MAX_LATENCY = 8;
const TARGET_LATENCY = 2.5;
// Seconds of played media kept buffered.
const KEEP_BEHIND = 10;
let pin = "";
let retry = null;
// The running player: { stop() }, or null.
let player = null;
// Set once native HLS failed before it ever played: use MSE from then on.
let nativeBroken = false;

function later(delay) {
  clearTimeout(retry);
  retry = setTimeout(join, delay);
}

function stopPlayback() {
  const running = player;
  player = null;
  if (running) {
    running.stop();
  }
}

// Playback ended (session lost, stream restarted, error): join again.
function lost(message) {
  stopPlayback();
  status.textContent = message;
  later(2000);
}

async function join() {
  stopPlayback();
  let response;
  try {
    response = await fetch("/v1/live/session", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "pin=" + pin,
      credentials: "same-origin",
    });
  } catch (error) {
    status.textContent = "The mixer is not reachable. Retrying...";
    later(3000);
    return;
  }
  const reason = response.status === 204 ? "" : await response.text();
  if (response.status === 204) {
    form.hidden = true;
    play();
  } else if (response.status === 401) {
    video.hidden = true;
    form.hidden = false;
    status.textContent = pin === "" ? "Enter the PIN to watch." : "Wrong PIN.";
    pin = "";
    pinInput.focus();
  } else if (response.status === 429) {
    const seconds = Math.max(1, Number(response.headers.get("Retry-After")) || 60);
    status.textContent = "Too many wrong PINs. Try again in " + (seconds < 120
      ? seconds + " seconds." : Math.ceil(seconds / 60) + " minutes.");
    video.hidden = true;
    form.hidden = true;
    pin = "";
    later(seconds * 1000);
  } else if (reason === "full") {
    status.textContent = "The viewer limit is reached. Retrying...";
    later(5000);
  } else {
    video.hidden = true;
    status.textContent = "LiveLAN is off. Waiting for the mixer...";
    later(3000);
  }
}

function mediaSourceClass() {
  return window.ManagedMediaSource || window.MediaSource || null;
}

function play() {
  stopPlayback();
  const Source = mediaSourceClass();
  const native = video.canPlayType("application/vnd.apple.mpegurl") !== "";
  if (native && !(nativeBroken && Source)) {
    player = nativePlayer();
  } else if (Source) {
    player = new MsePlayer(Source);
  } else {
    status.textContent = "This browser cannot play the stream.";
    return;
  }
  video.hidden = false;
  status.textContent = LIVE_MESSAGE;
}

function nativePlayer() {
  const handle = { native: true, played: false, stop() {
    video.removeAttribute("src");
    video.load();
  } };
  video.src = playlist;
  video.play().catch(() => {});
  return handle;
}

video.addEventListener("playing", () => {
  if (player) {
    player.played = true;
    status.textContent = LIVE_MESSAGE;
  }
});

// A lost session (PIN change, idle, restart), a stream that is not
// published yet, or a decoding failure: join again and reload.
video.addEventListener("error", () => {
  if (!player) {
    return;
  }
  if (player.native && !player.played && mediaSourceClass()) {
    nativeBroken = true;
  }
  lost("Reconnecting...");
});

class SessionLost extends Error {}

function sleep(milliseconds) {
  return new Promise((resolve) => setTimeout(resolve, milliseconds));
}

// The parsed media playlist, or null when it is not one.
function parsePlaylist(text) {
  if (!text.startsWith("#EXTM3U")) {
    return null;
  }
  const parsed = { sequence: 0, target: 1, init: null, segments: [] };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (line.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
      parsed.sequence = parseInt(line.slice(22), 10) || 0;
    } else if (line.startsWith("#EXT-X-TARGETDURATION:")) {
      parsed.target = Math.max(1, Number(line.slice(22)) || 1);
    } else if (line.startsWith("#EXT-X-MAP:")) {
      const uri = /URI="([^"]+)"/.exec(line);
      parsed.init = uri && /^init\.mp4$/.test(uri[1]) ? uri[1] : null;
    } else if (/^segment-[0-9]+\.m4s$/.test(line)) {
      parsed.segments.push(line);
    }
  }
  return parsed;
}

function hex(byte) {
  return byte.toString(16).padStart(2, "0");
}

// The MIME type of an initialization segment: the H.264 profile and level
// from its `avcC` box, and AAC-LC audio when it carries an `mp4a` track.
function mimeOf(init) {
  const bytes = new Uint8Array(init);
  const at = (i, text) => text.split("").every((c, k) => bytes[i + k] === c.charCodeAt(0));
  const codecs = [];
  for (let i = 4; i + 8 <= bytes.length; i++) {
    if (at(i, "avcC")) {
      codecs.push("avc1." + hex(bytes[i + 5]) + hex(bytes[i + 6]) + hex(bytes[i + 7]));
      break;
    }
  }
  for (let i = 4; i + 4 <= bytes.length; i++) {
    if (at(i, "mp4a")) {
      codecs.push("mp4a.40.2");
      break;
    }
  }
  return 'video/mp4; codecs="' + codecs.join(",") + '"';
}

class MsePlayer {
  constructor(Source) {
    this.stopped = false;
    this.played = false;
    this.buffer = null;
    // The media sequence number of the next segment to append.
    this.next = null;
    this.aborter = new AbortController();
    this.source = new Source();
    this.url = URL.createObjectURL(this.source);
    if (Source === window.ManagedMediaSource) {
      video.disableRemotePlayback = true;
    }
    video.src = this.url;
    this.source.addEventListener("sourceopen", () => this.run(), { once: true });
    this.ticker = setInterval(() => this.follow(), 500);
  }

  stop() {
    this.stopped = true;
    clearInterval(this.ticker);
    this.aborter.abort();
    video.removeAttribute("src");
    video.load();
    URL.revokeObjectURL(this.url);
  }

  async run() {
    try {
      await this.feed();
    } catch (error) {
      if (this.stopped || player !== this) {
        return;
      }
      lost(error instanceof SessionLost ? "Reconnecting..." : "Playback failed. Reconnecting...");
    }
  }

  // One media fetch with the session cookie: its bytes (or text), or null
  // when it is not there (not yet published, or already rotated out). A
  // refused session ends the player, which joins again.
  async fetch(leaf, text) {
    const response = await fetch("/live/" + leaf, {
      credentials: "same-origin",
      cache: "no-store",
      signal: this.aborter.signal,
    });
    if (response.status === 401 || response.status === 503) {
      throw new SessionLost();
    }
    if (!response.ok) {
      return null;
    }
    return text ? response.text() : response.arrayBuffer();
  }

  async feed() {
    while (!this.stopped) {
      const text = await this.fetch("index.m3u8", true);
      const list = text === null ? null : parsePlaylist(text);
      if (list === null || list.init === null || list.segments.length === 0) {
        await sleep(1000);
        continue;
      }
      if (this.buffer === null && !(await this.open(list.init))) {
        await sleep(1000);
        continue;
      }
      const first = list.sequence;
      const last = first + list.segments.length - 1;
      // Start near the live edge, and jump there again when the segments
      // to come were already rotated out (a stall, a slow network).
      if (this.next === null || this.next < first || this.next > last + 1) {
        this.next = Math.max(first, last - START_BEHIND);
      }
      while (!this.stopped && this.next <= last) {
        const data = await this.fetch(list.segments[this.next - first], false);
        // A missing segment leaves a gap that follow() skips.
        if (data !== null) {
          await this.trim();
          await this.append(data);
        }
        this.next += 1;
      }
      this.follow();
      await sleep(list.target * 500);
    }
  }

  // Fetches the initialization segment and opens the SourceBuffer.
  async open(leaf) {
    const init = await this.fetch(leaf, false);
    if (init === null || this.stopped) {
      return false;
    }
    const mime = mimeOf(init);
    if (!mediaSourceClass().isTypeSupported(mime)) {
      this.stopped = true;
      status.textContent = "This browser cannot play the stream (" + mime + ").";
      return false;
    }
    this.buffer = this.source.addSourceBuffer(mime);
    this.buffer.mode = "segments";
    await this.append(init);
    return true;
  }

  // Waits for the SourceBuffer's pending operation, started by `start`.
  update(start) {
    return new Promise((resolve, reject) => {
      const buffer = this.buffer;
      const settle = (event) => {
        buffer.removeEventListener("updateend", settle);
        buffer.removeEventListener("error", settle);
        if (event.type === "error") {
          reject(new Error("the media could not be appended"));
        } else {
          resolve();
        }
      };
      buffer.addEventListener("updateend", settle);
      buffer.addEventListener("error", settle);
      try {
        start(buffer);
      } catch (error) {
        buffer.removeEventListener("updateend", settle);
        buffer.removeEventListener("error", settle);
        reject(error);
      }
    });
  }

  async append(data) {
    if (this.stopped) {
      return;
    }
    try {
      await this.update((buffer) => buffer.appendBuffer(data));
    } catch (error) {
      if (error.name !== "QuotaExceededError" || this.stopped) {
        throw error;
      }
      // Full: drop everything already played and try once more.
      await this.trim(true);
      await this.update((buffer) => buffer.appendBuffer(data));
    }
  }

  // Drops media played more than KEEP_BEHIND seconds ago.
  async trim(all) {
    const ranges = this.buffer.buffered;
    if (ranges.length === 0) {
      return;
    }
    const start = ranges.start(0);
    const keep = all ? 0.5 : KEEP_BEHIND;
    const until = video.currentTime - keep;
    if (until - start > (all ? 0 : KEEP_BEHIND)) {
      await this.update((buffer) => buffer.remove(start, until));
    }
  }

  // Keeps playback on buffered media near the live edge: out of a gap (a
  // missing segment, the start), and up to the edge when it fell behind.
  follow() {
    if (this.stopped || this.buffer === null) {
      return;
    }
    const ranges = video.buffered;
    if (ranges.length === 0) {
      return;
    }
    const time = video.currentTime;
    const last = ranges.length - 1;
    const end = ranges.end(last);
    const live = Math.max(ranges.start(last), end - TARGET_LATENCY);
    let target = null;
    let inside = -1;
    for (let i = 0; i <= last; i++) {
      if (time >= ranges.start(i) - 0.05 && time <= ranges.end(i)) {
        inside = i;
      }
    }
    if (inside === -1) {
      // Before, between, or past the buffered media: on to the next range
      // (the last one is joined near its live edge).
      let next = last;
      for (let i = last; i >= 0 && ranges.start(i) > time; i--) {
        next = i;
      }
      target = next === last || ranges.start(next) <= time ? live : ranges.start(next);
    } else if (inside < last && ranges.end(inside) - time < 0.3) {
      // Stalled at the end of a range with a gap after it.
      target = ranges.start(inside + 1);
    } else if (!video.paused && end - time > MAX_LATENCY) {
      target = live;
    }
    if (target !== null && Math.abs(target - time) > 0.05) {
      video.currentTime = target;
    }
    if (!this.played && video.paused) {
      video.play().catch(() => {});
    }
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  pin = pinInput.value.replace(/[^0-9]/g, "");
  pinInput.value = "";
  join();
});

join();
</script>
</body>
</html>
