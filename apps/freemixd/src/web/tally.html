<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>FreeMix Tally</title>
<style>
  :root { --program: #d0021b; --preview: #12872f; --idle: #3a3a3a; --offline: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  button, input, select { font: inherit; }
  button { min-height: 44px; padding: 0 1rem; border-radius: 8px; border: 1px solid #fff6;
    background: #0008; color: #fff; }
  button:disabled { opacity: .4; }
  header { display: flex; gap: .5rem; padding: .5rem; flex-wrap: wrap; align-items: center;
    padding-top: max(.5rem, env(safe-area-inset-top)); }
  header .spacer { flex: 1; }
  #tally { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 1rem; background: var(--offline); transition: background-color .1s; }
  #tally[data-light="program"] { background: var(--program); }
  #tally[data-light="preview"] { background: var(--preview); }
  #tally[data-light="idle"] { background: var(--idle); }
  #tally[data-light="offline"] #state { color: #ffb000; }
  #label { font-size: clamp(2rem, 12vw, 9rem); font-weight: 700; word-break: break-word; }
  #state { font-size: clamp(1.5rem, 8vw, 5rem); font-weight: 800; letter-spacing: .08em; }
  #status { padding: .5rem; padding-bottom: max(.5rem, env(safe-area-inset-bottom));
    text-align: center; font-size: .9rem; color: #ddd; background: #000a; }
  #board { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
    width: min(100%, 48rem); margin-top: 1rem; }
  #board button { min-height: 4rem; font-weight: 600; }
  #board button[data-light="program"] { background: var(--program); }
  #board button[data-light="preview"] { background: var(--preview); }
  #board button[data-light="idle"] { background: var(--idle); }
  /* Edit padlocks are informational: they never change a light. */
  .padlock { display: inline-block; width: .9em; height: .9em; vertical-align: -.1em; }
  #lock { display: inline-flex; gap: .4em; align-items: center; margin-top: .75rem;
    padding: .2rem .7rem; border-radius: 999px; background: #000a; color: #ffd27a;
    font-size: clamp(.9rem, 3vw, 1.4rem); font-weight: 600; }
  #board button .padlock { margin-right: .35em; color: #ffd27a; }
  #pair h2 { margin: 0; font-size: 1.3rem; }
  #pair p { margin: 0; }
  #pair-fingerprint { font-size: .85rem; overflow-wrap: anywhere; color: #ffd27a; }
  #pair-error { color: #ffb000; font-weight: 600; }
  #token-option { width: min(100%, 26rem); margin-top: 1rem; text-align: left; }
  #token-option summary { min-height: 44px; padding: .65rem 0; cursor: pointer; }
  form { display: grid; gap: .75rem; width: min(100%, 26rem); text-align: left; }
  label { display: grid; gap: .25rem; }
  input, select { min-height: 44px; padding: 0 .5rem; border-radius: 8px; border: 1px solid #fff6;
    background: #111; color: #fff; }
  /* Recorders and destinations on air (Protocol 2.66): status only. */
  #outputs { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-top: .75rem; }
  #outputs span { padding: .15rem .6rem; border-radius: 999px; background: #000a; font-weight: 800;
    letter-spacing: .05em; font-size: clamp(.85rem, 2.6vw, 1.3rem); font-variant-numeric: tabular-nums; }
  #outputs span[data-tone="on"] { color: #ff6b7a; }
  #outputs span[data-tone="on"]::before { content: "\25CF  "; }
  #outputs span[data-tone="failed"] { color: #ffb000; }
  #outputs span[data-tone="starting"] { color: #ffe2a0; }
  /* A slim Program audio level per Master channel. */
  #vu { display: grid; gap: 3px; width: min(100%, 24rem); margin-top: .6rem; }
  #vu span { display: block; height: 6px; border-radius: 3px; background: #000a; overflow: hidden; }
  #vu span i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0);
    background: linear-gradient(to right, #1fa34a 0 63.6%, #e3a21a 63.6% 81.8%, #e5322d 81.8% 100%); }
  .full header, .full #status { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header id="toolbar">
  <button type="button" id="inputs" data-i18n="inputs" data-i18n-label="inputsLabel" aria-label="Choose input">Inputs</button>
  <button type="button" id="language" lang="es" data-i18n="otherLanguage" data-i18n-label="otherLanguageLabel" aria-label="Ver en español">ES</button>
  <span class="spacer"></span>
  <button type="button" id="preview" hidden data-i18n="preview" data-i18n-label="previewLabel" aria-label="Put this input on Preview (P)">Preview</button>
  <button type="button" id="cut" hidden data-i18n="cut" data-i18n-label="cutLabel" aria-label="Cut Preview to Program (C)">Cut</button>
  <button type="button" id="standby" hidden data-i18n="standby" data-i18n-label="standbyLabel" aria-label="Put the next cue on standby (S)">Standby</button>
  <button type="button" id="go" hidden data-i18n="go" data-i18n-label="goLabel" aria-label="GO: fire the cue on standby (G)">GO</button>
  <select id="arm-delay" hidden data-i18n-label="armDelayLabel" aria-label="Fire in: how long after arming the cue on standby fires"></select>
  <button type="button" id="arm" hidden data-i18n="arm" data-i18n-label="armLabel" aria-label="Arm the cue on standby to fire by itself after the chosen delay, like GO">Arm GO</button>
  <button type="button" id="disarm" hidden data-i18n="disarm" data-i18n-label="disarmLabel" aria-label="Cancel the armed GO so it never fires">Disarm</button>
  <button type="button" id="signout" hidden>Forget token</button>
  <button type="button" id="fullscreen" data-i18n="fullscreen" data-i18n-label="fullscreenLabel" aria-label="Toggle full-screen tally (F)">Full screen</button>
</header>
<main id="tally" data-light="offline">
  <div id="label" aria-live="polite">FreeMix Tally</div>
  <div id="state" role="status" aria-live="polite">OFFLINE</div>
  <div id="lock" hidden><span id="lock-text"></span></div>
  <div id="outputs" role="status" aria-live="off" data-i18n-label="outputsLabel" aria-label="Recording and streaming" hidden></div>
  <div id="vu" aria-hidden="true" hidden></div>
  <div id="cue" hidden aria-live="polite"></div>
  <div id="board" role="list" data-i18n-label="inputs" aria-label="Inputs" hidden></div>
  <form id="pair" hidden autocomplete="off" novalidate>
    <h2 data-i18n="pairHeading">Pair this device</h2>
    <p id="pair-hint" data-i18n="pairHint">In FreeMix Studio, open Web access and start pairing, then type the six-digit code it shows.</p>
    <p id="pair-link-hint" hidden data-i18n="pairLinkHint">Opened from a FreeMix Studio pairing link: check the name and press Pair.</p>
    <p id="pair-fingerprint" hidden></p>
    <label id="pair-code-field"><span data-i18n="pairCode">Pairing code</span>
      <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" spellcheck="false">
    </label>
    <label><span data-i18n="deviceName">Device name</span>
      <input id="device-name" maxlength="48" autocomplete="off" spellcheck="false">
    </label>
    <button type="submit" id="pair-submit" data-i18n="pair">Pair</button>
    <p id="pair-error" role="alert" hidden></p>
  </form>
  <details id="token-option" hidden>
    <summary data-i18n="useToken">Use an access token instead</summary>
    <form id="setup" autocomplete="off">
    <label><span data-i18n="token">Access token</span>
      <input id="token" type="password" required minlength="32" maxlength="256" autocomplete="off">
    </label>
    <label><span data-i18n="role">Role</span>
      <select id="role">
        <option value="viewer" data-i18n="roleViewerChoice">Viewer (tally only)</option>
        <option value="operator" data-i18n="roleOperatorChoice">Operator (tally and shortcuts)</option>
      </select>
    </label>
    <button type="submit" data-i18n="connect">Connect</button>
  </form>
  </details>
</main>
<div id="status" role="log" aria-live="polite">Not connected</div>

      case "snapshot": {
        if (!sameServer(record)) throw new Error("foreign snapshot");
        show.name = required(record, "show_name");
        // `id~name~lifecycle`: the label is the middle part only.
        show.inputs = required(record, "inputs").split(",").map((item) => {
          const parts = item.split("~");
          if (parts.length !== 3 || !parts[0]) throw new Error("malformed input");
          return { id: parts[0], label: decodeURIComponent(parts[1]) };
        });
        link.revision = Number(required(record, "revision"));
        show.desired = { program: required(record, "desired_program"), preview: required(record, "desired_preview") };
        show.realized = {
          program: required(record, "realized_program"), preview: required(record, "realized_preview"),
          manualFrom: "", manualTo: "",
        };
        if (record.fields.get("realized_manual_active") === "1") {
          show.realized.manualFrom = required(record, "realized_manual_from");
          show.realized.manualTo = required(record, "realized_manual_to");
        }
        const lockedInputs = required(record, "locked_inputs");
        show.locks = {
          project: required(record, "project_locked") === "1",
          inputs: new Set(lockedInputs ? lockedInputs.split(",") : []),
        };
        show.streamNames = streamNames(required(record, "streams"));
        show.cueLists = new Map(); // its cue_list_state records follow
        show.cueFrame = null;
        {
          const [numerator, denominator] = required(record, "frame_rate").split("/").map(Number);
          show.rate = numerator > 0 && denominator > 0 ? numerator / denominator : 0;
        }
        show.desiredByRevision.clear();
        trackDesired(link.revision, show.desired.program, show.desired.preview);
        if (!show.inputs.some((input) => input.id === selected)) { selected = ""; choosing = true; }
        link.phase = "live";
        link.everLive = true;
        whoamiChecked = false;
        link.attempt = 0;
        link.syncDeadline = 0;
        link.nextHeartbeat = Date.now() + HEARTBEAT_INTERVAL_MS;
        requestWakeLock();
        return;
      }
      case "event": {
        if (link.phase !== "live" || !sameServer(record)) throw new Error("unexpected event");
        const revision = Number(required(record, "revision"));
        if (revision !== link.revision + 1) { closeSocket(); return; } // gap: resynchronize
        link.revision = revision;
        const name = required(record, "event");
        if (name === "desired_switcher" || name === "stinger_slots_changed"
            || name === "playlist_changed" || name === "cue_run_changed"
            || name === "script_ran") {
          // A playlist take, a cue's actions, or a script run move Program too.
          show.desired = { program: required(record, "program"), preview: required(record, "preview") };
          trackDesired(revision, show.desired.program, show.desired.preview);
          if (name === "cue_run_changed" || name === "script_ran") {
            show.streamNames = streamNames(required(record, "streams"));
          }
          if (name === "cue_run_changed") {
            const list = show.cueLists.get(required(record, "list"));
            if (list) { list.standby = cueStandby(record); list.armed = cueArmed(record); }
            noteCueFrame(record);
          }
        } else if (name === "streams_changed" || name === "stream_target_changed") {
          show.streamNames = streamNames(required(record, "streams"));
        } else if (name === "cue_list_changed") {
          show.cueLists.set(required(record, "list"), cueList(record));
        } else if (name === "cue_list_removed") {
          show.cueLists.delete(required(record, "list"));
        } else if (name === "input_renamed") {
          const id = required(record, "input");
          const input = show.inputs.find((candidate) => candidate.id === id);
          if (input) input.label = required(record, "name");
        } else if (name === "input_order_changed") {
          const order = required(record, "inputs").split(",");
          show.inputs.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        } else if (name === "input_added") {
          show.inputs.push({ id: required(record, "input"), label: required(record, "name") });
        } else if (name === "input_removed") {
          const id = required(record, "input");
          show.inputs = show.inputs.filter((candidate) => candidate.id !== id);
          show.locks.inputs.delete(id); // Removing an input drops its lock.
          if (selected === id) { selected = ""; choosing = true; }
        } else if (name === "edit_lock_changed") {
          const locked = required(record, "locked") === "1";
          const scope = required(record, "scope");
          if (scope === "project") show.locks.project = locked;
          else if (scope === "input") {
            const id = required(record, "input");
            if (locked) show.locks.inputs.add(id); else show.locks.inputs.delete(id);
          } else throw new Error("unknown edit lock scope");
        }
        settleGoRetry();
        return;
      }
      case "runtime_event": {
        if (!sameServer(record) || required(record, "event") !== "realized") return;
        const desired = show.desiredByRevision.get(Number(required(record, "revision")));
        if (!desired) return;
        show.realized = { program: desired.program, preview: desired.preview, manualFrom: "", manualTo: "" };
        if (record.fields.get("manual_active") === "1") {
          show.realized.manualFrom = required(record, "manual_from");
          show.realized.manualTo = required(record, "manual_to");
        }
        return;
      }
      case "cue_list_state":
        if (link.phase !== "live") throw new Error("unexpected cue list state");
        show.cueLists.set(required(record, "list"), cueList(record));
        noteCueFrame(record);
        return;
      case "heartbeat_acknowledgement":
        if (Number(required(record, "heartbeat_sequence")) === link.pendingHeartbeat) {
          link.pendingHeartbeat = 0;
          link.heartbeatDeadline = 0;
          link.nextHeartbeat = Date.now() + HEARTBEAT_INTERVAL_MS;
        }
        return;
      case "command_result": {
        const sent = goSent && goSent.id === required(record, "id") ? goSent : null;
        if (sent) goSent = null;
        if (record.fields.get("status") === "rejected") {
          const code = required(record, "code");
          // A GO that lost a race with another command: retry it once the
          // page has caught up, if the same cue is still on standby.
          if (sent && !sent.retried && code === "revision_conflict") {
            goRetry = {
              list: sent.list, cue: sent.cue,
              revision: Number(required(record, "current_revision")),
              deadline: Date.now() + GO_RETRY_TIMEOUT_MS,
            };
            settleGoRetry();
            return;
          }
          ui.status.textContent = tr("shortcutRejected", { code });
        }
        return;
      }
      case "recorder_status": {
        const sequence = freshLossy(record, telemetry.recorderSequence);
        if (sequence < 0) return LOSSY;
        // `<slot>:<state>:<elapsed_ms>:<failure>`, `;` separated.
        telemetry.recorders = required(record, "recorders").split(";").map((item) => {
          const parts = item.split(":");
          if (parts.length !== 4) throw new Error("malformed recorder status");
          return { slot: parts[0], state: parts[1], elapsedMs: Number(parts[2]), failure: parts[3] };
        });
        telemetry.recordersAt = Date.now();
        telemetry.recorderSequence = sequence;
        return LOSSY;
      }
      case "stream_status": {
        const sequence = freshLossy(record, telemetry.streamSequence);
        if (sequence < 0) return LOSSY;
        // `target:realized:connected:muxed:enqueued:dropped:reconnects:
        // uptime_ms:bitrate_kbps:failure[:local triple]`, `;` separated.
        telemetry.streams = new Map(required(record, "samples").split(";").map((item) => {
          const parts = item.split(":");
          if (parts.length !== 10 && parts.length !== 13) throw new Error("malformed stream sample");
          return [parts[0], { realized: parts[1], uptimeMs: Number(parts[7]), failure: parts[9] }];
        }));
        telemetry.streamsAt = Date.now();
        telemetry.streamSequence = sequence;
        return LOSSY;
      }
      case "audio_meters": {
        const sequence = freshLossy(record, telemetry.meterSequence);
        if (sequence < 0) return LOSSY;
        // Master `<peak>:<rms>` millionths, comma separated.
        telemetry.meters = required(record, "master").split(",").map((item) => Number(item.split(":")[0]) / 1e6);
        telemetry.metersAt = Date.now();
        telemetry.meterSequence = sequence;
        return LOSSY;
      }
      case "source_sync_status":
        // Live source sync (Protocol 2.101 on the Web) is shown on /operator.
        return LOSSY;
      case "error":
        // Includes server_shutting_down: reconnect after backoff.
        closeSocket();
        return;
      default:
        return; // Not shown on this page.
    }
  }

  function tick() {
    const now = Date.now();
    if (link.phase === "waiting" && now >= link.retryAt) connect();
    else if (link.phase === "open" && link.syncDeadline && now >= link.syncDeadline) closeSocket();
    else if (link.phase === "live") {
      if (link.heartbeatDeadline && now >= link.heartbeatDeadline) { closeSocket(); return; }
      if (!link.pendingHeartbeat && now >= link.nextHeartbeat) {
        link.pendingHeartbeat = link.heartbeatSequence++;
        link.heartbeatDeadline = now + HEARTBEAT_ACK_TIMEOUT_MS;
        send(encodeRecord("heartbeat", [
          ["engine_id", link.server.engine_id], ["project_id", link.server.project_id],
          ["state_epoch", link.server.state_epoch], ["log_id", link.server.log_id],
          ["sequence", link.pendingHeartbeat], ["sent_at_ms", now], ["applied", "0"],
        ]));
      }
    }
    if (goRetry && now >= goRetry.deadline) {
      goRetry = null;
      ui.status.textContent = tr("goStale");
    }
    if (link.phase === "waiting") render();
    else if (link.phase === "live") { renderCue(); renderOutputs(); }
  }

  // ---- Presentation: mirrors freemix-web's TallyPresentation. ----
  function lightOf(id) {
    if (link.phase !== "live") return "offline";
    const realized = show.realized;
    if (realized.program === id || realized.manualFrom === id || realized.manualTo === id) return "program";
    if (realized.preview === id) return "preview";
    return "idle";
  }
  const STATE_KEY = { program: "stateProgram", preview: "statePreview", idle: "stateIdle", offline: "stateOffline" };

  // Edit padlock of an input: "project" when the whole project is locked,
  // "input" for its own lock, otherwise "". Unknown while not live.
  function lockOf(id) {
    if (link.phase !== "live") return "";
    if (show.locks.project) return "project";
    return show.locks.inputs.has(id) ? "input" : "";
  }
  const LOCK_KEY = { project: "lockProject", input: "lockInput" };
  const SVG = "http://www.w3.org/2000/svg";
  function padlock() {
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("class", "padlock");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("aria-hidden", "true");
    const shackle = document.createElementNS(SVG, "path");
    shackle.setAttribute("d", "M4.5 7V5a3.5 3.5 0 0 1 7 0v2");
    shackle.setAttribute("fill", "none");
    shackle.setAttribute("stroke", "currentColor");
    shackle.setAttribute("stroke-width", "1.8");
    const body = document.createElementNS(SVG, "rect");
    body.setAttribute("x", "2.5"); body.setAttribute("y", "7");
    body.setAttribute("width", "11"); body.setAttribute("height", "8"); body.setAttribute("rx", "1.5");
    body.setAttribute("fill", "currentColor");
    svg.append(shackle, body);
    return svg;
  }
  ui.lock.prepend(padlock());

  function shortcutState(permission, extra) {
    if (!link.permissions.includes(permission)) return "hidden";
    return link.phase === "live" && extra ? "enabled" : "disabled";
  }

  function statusText() {
    switch (link.phase) {
      case "idle": return tr("statusIdle");
      case "connecting": case "open":
        return link.attempt ? tr("statusReconnecting", { attempt: link.attempt }) : tr("statusConnecting");
      case "live": {
        const as = tr(role() === "operator" ? "roleOperator" : "roleViewer");
        return show.name ? tr("statusLiveShow", { show: show.name, role: as }) : tr("statusLive", { role: as });
      }
      case "waiting":
        // A page that never got in may hold a wrong token, or every web
        // client slot on the gateway may be taken (it refuses with 503).
        return tr(link.everLive ? "statusWaiting" : "statusWaitingHint", {
          attempt: link.attempt, seconds: seconds(Math.max(0, link.retryAt - Date.now())),
        });
      case "stopped": return link.stopReason ? tr(link.stopReason.key, link.stopReason.values) : tr("statusStopped");
      default: return "";
    }
  }

  function render() {
    const input = show.inputs.find((candidate) => candidate.id === selected);
    const light = input ? lightOf(input.id) : "offline";
    ui.tally.dataset.light = choosing ? "offline" : light;
    ui.label.textContent = choosing || !input ? tr("title") : input.label;
    ui.state.textContent = choosing ? tr(link.phase === "live" ? "chooseInput" : STATE_KEY.offline)
      : tr(STATE_KEY[light]);
    ui.state.setAttribute("aria-label", choosing ? ui.state.textContent : tr("tallyLabel", { state: tr(STATE_KEY[light]) }));
    // The selected input's padlock; on the input board only the project lock.
    const lock = choosing ? (link.phase === "live" && show.locks.project ? "project" : "")
      : input ? lockOf(input.id) : "";
    ui.lock.hidden = !lock;
    ui.lockText.textContent = lock ? tr(LOCK_KEY[lock]) : "";
    ui.lock.setAttribute("aria-label", lock ? tr("editsLocked", { lock: tr(LOCK_KEY[lock]) }) : "");
    ui.status.textContent = statusText();
    renderOutputs();
    renderPairing();
    ui.board.hidden = !choosing || link.phase !== "live";
    if (!ui.board.hidden) renderBoard();
    const cues = renderCue();
    const standby = cues && cues.cues.find((cue) => cue.id === cues.standby);
    // Arming needs exactly GO's permissions (the server checks the chain
    // the armed cue fires); Disarm needs only a cue control's.
    for (const [button, state] of [
      [ui.preview, shortcutState("select_preview", input && show.desired.preview !== input.id)],
      [ui.cut, shortcutState("transition", true)],
      [ui.go, cues ? shortcutState("transition", Boolean(standby)) : "hidden"],
      [ui.standby, cues ? shortcutState("transition", cues.cues.length > 0) : "hidden"],
      [ui.armDelay, cues ? shortcutState("transition", Boolean(standby)) : "hidden"],
      [ui.arm, cues ? shortcutState("transition", Boolean(standby)) : "hidden"],
      [ui.disarm, cues ? shortcutState("transition", Boolean(cues.armed)) : "hidden"],
    ]) {
      button.hidden = state === "hidden";
      button.disabled = state !== "enabled";
    }
    // Hover help: what "selected" means for a GO or arm from here (RC-004).
    const own = tallySelection() ? show.inputs.find((candidate) => candidate.id === tallySelection()) : null;
    ui.go.title = own ? tr("goSelectedHover", { input: own.label }) : tr("goNoSelectionHover");
    ui.arm.title = own ? tr("armSelectedHover", { input: own.label }) : tr("armNoSelectionHover");
  }
  // The cue line: the armed GO and its countdown, else the cue on standby.
  // Returns the list GO drives (null when there is none or not live).
  function renderCue() {
    const cues = link.phase === "live" ? goList() : null;
    const standby = cues && cues.cues.find((cue) => cue.id === cues.standby);
    const armed = cues && cues.armed;
    ui.cue.hidden = !cues;
    let text = "";
    if (armed) {
      const cue = cues.cues.find((candidate) => candidate.id === armed.cue);
      const ms = msUntil(armed.due);
      text = tr("cueArmed", {
        list: cues.name, cue: cue ? cue.name : armed.cue, time: ms === null ? "?" : countdown(ms),
      });
    } else if (cues) {
      text = standby ? tr("cueStandby", { list: cues.name, cue: standby.name })
        : tr("cueNothing", { list: cues.name });
    }
    if (ui.cue.textContent !== text) ui.cue.textContent = text;
    return cues;
  }

  // The short localized reason for one failure token; "" for none.
  function failureText(token, recorder) {
    if (!token) return "";
    const match = /^([a-z_]+)(?:\.(-?\d+))?$/.exec(token);
    let key = match && Object.hasOwn(FAILURE_KEY, match[1]) ? FAILURE_KEY[match[1]] : "failUnknown";
    if (Array.isArray(key)) key = key[recorder ? 0 : 1];
    const reason = tr(key);
    return match && match[2] !== undefined ? tr("failWithExitCode", { reason, code: match[2] }) : reason;
  }

  // H:MM:SS of a running time.
  function clock(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const pad = (value) => String(value).padStart(2, "0");
    return Math.floor(total / 3600) + ":" + pad(Math.floor(total / 60) % 60) + ":" + pad(total % 60);
  }
  function fresh(at) { return at > 0 && Date.now() - at < TELEMETRY_STALE_MS; }
  // The outputs line: every recorder and destination that is recording,
  // live, starting, or failed, from the daemon's realized status; and a
  // slim Program level per Master channel. Status only: nothing here acts.
  function renderOutputs() {
    const live = link.phase === "live";
    const chips = [];
    if (live && fresh(telemetry.recordersAt)) {
      for (const recorder of telemetry.recorders) {
        const slot = recorder.slot;
        if (recorder.state === "recording") {
          chips.push(["on", tr("recRunning", { slot,
            time: clock(recorder.elapsedMs + Date.now() - telemetry.recordersAt) })]);
        } else if (recorder.state === "starting") {
          chips.push(["starting", tr("recStarting", { slot })]);
        } else if (recorder.state === "failed") {
          chips.push(["failed", tr("recFailed", { slot, reason: failureText(recorder.failure, true) })]);
        }
      }
    }
    if (live && fresh(telemetry.streamsAt)) {
      for (const [id, sample] of telemetry.streams) {
        const name = show.streamNames.get(id) || tr("streamUnnamed", { id });
        if (sample.realized === "live" || sample.realized === "congested") {
          chips.push(["on", tr("streamRunning", { name,
            time: clock(sample.uptimeMs + (sample.uptimeMs > 0 ? Date.now() - telemetry.streamsAt : 0)) })]);
        } else if (sample.realized === "starting") {
          chips.push(["starting", tr("streamStarting", { name })]);
        } else if (sample.realized === "waiting_to_reconnect") {
          chips.push(["starting", tr("streamReconnecting", { name })]);
        } else if (sample.realized === "failed") {
          chips.push(["failed", tr("streamFailed", { name, reason: failureText(sample.failure || "unknown", false) })]);
        } else if (sample.realized === "unavailable") {
          chips.push(["failed", tr("streamUnavailable", { name })]);
        }
      }
    }
    ui.outputs.hidden = chips.length === 0;
    if (ui.outputs.children.length !== chips.length) {
      ui.outputs.replaceChildren(...chips.map(() => document.createElement("span")));
    }
    chips.forEach(([tone, text], index) => {
      const chip = ui.outputs.children[index];
      chip.dataset.tone = tone;
      if (chip.textContent !== text) chip.textContent = text;
    });
    const meters = live && telemetry.meters && Date.now() - telemetry.metersAt < METER_STALE_MS ? telemetry.meters : [];
    ui.vu.hidden = meters.length === 0;
    if (ui.vu.children.length !== meters.length) {
      ui.vu.replaceChildren(...meters.map(() => {
        const bar = document.createElement("span");
        bar.append(document.createElement("i"));
        return bar;
      }));
    }
    // The same -60..+6 dBFS scale as the operator page.
    meters.forEach((peak, index) => {
      const db = peak > 0 ? 20 * Math.log10(peak) : -Infinity;
      const position = Math.min(1, Math.max(0, (db + 60) / 66));
      ui.vu.children[index].firstChild.style.transform = "scaleX(" + position.toFixed(3) + ")";
    });
  }

  function renderBoard() {
    const buttons = show.inputs.map((input) => {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("role", "listitem");
      button.dataset.light = lightOf(input.id);
      button.textContent = input.label;
      if (lockOf(input.id) === "input") {
        button.dataset.lock = "input";
        button.prepend(padlock());
        button.setAttribute("aria-label", tr("inputLocked", { input: input.label }));
      }
      button.addEventListener("click", () => {
        selected = input.id;
        choosing = false;
        store.setItem("freemix.tally.input", selected);
        render();
      });
      return button;
    });
    ui.board.replaceChildren(...buttons);
  }

  // ---- Shortcuts. The server authorizes every command again. ----
  function sendCommand(payload) {
    commandCounter += 1;
    const id = "tally-" + sessionNonce + "-" + commandCounter;
    send(encodeRecord("command", [
      ["protocol", PROTOCOL], ["id", id], ["idempotency_key", id], ...payload,
    ]));
    return id;
  }
  function previewSelected() {
    if (ui.preview.hidden || ui.preview.disabled || !selected) return;
    sendCommand([["payload", "select_preview"], ["input", selected]]);
  }
  function cut() {
    if (ui.cut.hidden || ui.cut.disabled) return;
    sendCommand([["payload", "cut"]]);
  }
  // GO fires the standby cue of the lowest-numbered cue list; Standby moves
  // standby to the cue after it (the first cue when none is on standby).
  // GO expects the revision it was pressed at: a second press, or another
  // tally's GO, before the first GO is replicated is refused instead of
  // firing the next cue as well. A GO refused that way because another
  // command landed first is retried once, after the page has caught up to
  // the revision it was refused at, and only while the cue on standby is
  // still the one the operator saw; the retry names that cue (and the new
  // revision), so it never fires a cue the page did not show. A double
  // press is not retried: by then its first GO has moved standby on.
  function go() {
    const cues = goList();
    if (ui.go.hidden || ui.go.disabled || !cues) return;
    goRetry = null;
    const id = sendCommand([["payload", "cue_go"], ["list", cues.id], ["expected_revision", String(link.revision)],
      ...selectedField()]);
    goSent = { id, list: cues.id, cue: cues.standby, retried: false };
  }
  function settleGoRetry() {
    if (!goRetry || link.phase !== "live" || link.revision < goRetry.revision) return;
    const retry = goRetry;
    goRetry = null;
    const cues = goList();
    if (retry.cue && cues && cues.id === retry.list && cues.standby === retry.cue) {
      const id = sendCommand([["payload", "cue_go"], ["list", retry.list], ["cue", retry.cue], ["expected_revision", String(link.revision)],
        ...selectedField()]);
      goSent = { id, list: retry.list, cue: retry.cue, retried: true };
    } else {
      ui.status.textContent = tr("goStandbyChanged");
    }
  }
  // Arm GO fires the cue the operator sees on standby (named, so a standby
  // move in between cannot arm another cue) after the chosen delay, on the
  // server's frame clock; Disarm drops it.
  function arm() {
    const cues = goList();
    if (ui.arm.hidden || ui.arm.disabled || !cues || !cues.standby) return;
    const delay = Number(ui.armDelay.value) || DEFAULT_ARM_DELAY_S;
    sendCommand([["payload", "cue_arm"], ["list", cues.id], ["cue", cues.standby], ["in_ms", String(delay * 1000)],
      ...selectedField()]);
  }
  function disarm() {
    const cues = goList();
    if (ui.disarm.hidden || ui.disarm.disabled || !cues) return;
    sendCommand([["payload", "cue_disarm"], ["list", cues.id]]);
  }
  function standbyNext() {
    const cues = goList();
    if (ui.standby.hidden || ui.standby.disabled || !cues || !cues.cues.length) return;
    const index = cues.cues.findIndex((cue) => cue.id === cues.standby);
    const next = cues.cues[(index + 1) % cues.cues.length];
    sendCommand([["payload", "cue_standby"], ["list", cues.id], ["cue", next.id]]);
  }
  function toggleFullScreen() {
    const full = !document.body.classList.contains("full");
    document.body.classList.toggle("full", full);
    try {
      if (full && document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (!full && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    } catch (error) { /* CSS full-screen layout still applies */ }
  }
  async function requestWakeLock() {
    try {
      if (!wakeLock && navigator.wakeLock && document.visibilityState === "visible") {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (error) { wakeLock = null; }
  }

  ui.preview.addEventListener("click", previewSelected);
  ui.cut.addEventListener("click", cut);
  ui.go.addEventListener("click", go);
  ui.standby.addEventListener("click", standbyNext);
  ui.arm.addEventListener("click", arm);
  ui.disarm.addEventListener("click", disarm);
  ui.fullscreen.addEventListener("click", toggleFullScreen);
  ui.language.addEventListener("click", toggleLanguage);
  ui.tally.addEventListener("dblclick", (event) => {
    if (event.target === ui.tally || event.target === ui.label || event.target === ui.state) toggleFullScreen();
  });
  ui.inputs.addEventListener("click", () => { choosing = true; render(); });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) document.body.classList.remove("full");
  });
  document.addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
    if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
    const key = event.key.toLowerCase();
    if (key === "f") toggleFullScreen();
    else if (key === "p") previewSelected();
    else if (key === "c") cut();
    else if (key === "g") go();
    else if (key === "s") standbyNext();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (link.phase === "waiting") link.retryAt = Date.now();
    if (link.phase === "live") requestWakeLock();
  });
  window.addEventListener("online", () => { if (link.phase === "waiting") link.retryAt = Date.now(); });
  ui.setup.addEventListener("submit", (event) => {
    event.preventDefault();
    store.setItem(TOKEN_KEY, ui.token.value);
    pairError(null);
    whoamiChecked = false;
    store.setItem("freemix.tally.role", ui.role.value);
    ui.token.value = "";
    link.attempt = 0;
    link.everLive = false;
    connect();
  });

  ui.pair.addEventListener("submit", submitPairing);
  ui.deviceName.addEventListener("input", () => { pairing.nameEdited = true; });
  setInterval(() => { if (pairing.retryUntil > Date.now() || pairing.error) renderPairing(); }, 500);
  ui.signout.addEventListener("click", signOut);

  ui.role.value = store.getItem("freemix.tally.role") === "operator" ? "operator" : "viewer";
  applyLanguage();
  ui.status.textContent = tr("notConnected");
  setInterval(tick, 250);
  connect();
})();
</script>
</body>
</html>
