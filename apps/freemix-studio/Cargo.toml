[package]
name = "freemix-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Screenshot aid: with FREEMIX_STUDIO_CAPTURE_METERS=1, feed a synthetic
# audio meter signal when the daemon sends none (see docs/progress).
capture-meter-signal = []

[dependencies]
command-group = "5.0.1"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
fm-animation = { path = "../../crates/foundation/fm-animation" }
fm-client = { path = "../../crates/services/fm-client", features = ["std-websocket"] }
fm-grade = { path = "../../crates/foundation/fm-grade" }
fm-io-omt = { path = "../../crates/io/fm-io-omt" }
fm-preset-file = { path = "../../crates/foundation/fm-preset-file" }
fm-protocol = { path = "../../crates/foundation/fm-protocol" }
fm-types = { path = "../../crates/foundation/fm-types" }
fm-ui-egui = { path = "../../crates/ui/fm-ui-egui" }
fm-ui-model = { path = "../../crates/ui/fm-ui-model" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", default-features = false, features = ["signal"] }

# CoreMIDI on macOS and WinMM on Windows (RC-005); Linux keeps reading the
# ALSA raw MIDI ports directly, so no ALSA development package is needed.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
midir = { version = "0.10.3", default-features = false }

[dev-dependencies]
fm-auth = { path = "../../crates/services/fm-auth" }
fm-clock = { path = "../../crates/media/fm-clock" }
fm-control = { path = "../../crates/services/fm-control" }
fm-engine = { path = "../../crates/services/fm-engine" }
fm-sim = { path = "../../crates/media/fm-sim" }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true
